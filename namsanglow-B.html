/* Hover and press feedback (zero specificity: design rules still win) */
:where(#app) :where(a,button,summary,input,select,textarea){transition:color .2s ease,background-color .2s ease,border-color .2s ease,box-shadow .25s ease,opacity .2s ease,transform .2s var(--ng-ease)}
:where(#app) :where(.btn,.add,.arr,.tg,.tab,.menu,.step,button.st,.nav-toggle,.icon,.ic,.fav):active{transform:scale(.97)}

/* Keyboard focus */
:where(#app) :focus-visible{outline:2px solid var(--ng-focus);outline-offset:3px}
:where(#app) :where(footer,[style*="background:#1E2623"],[style*="background:#2F2725"],[style*="background:#2F3B28"]) :focus-visible{outline-color:#fff}

/* Sticky header */
.hdr-sticky{position:sticky;top:0;z-index:40;transition:transform .35s var(--ng-ease),box-shadow .3s ease,padding .3s var(--ng-ease),background-color .3s ease}
@media (max-width:767px){#app.hdr-hide:not(.nav-open) .hdr-sticky{transform:translateY(-110%)}}

/* Page, section and image entrances */
@keyframes ngPage{from{opacity:0}}
@keyframes ngRise{from{opacity:0;transform:translateY(22px)}}
@keyframes ngFade{from{opacity:0}}
@media (prefers-reduced-motion:no-preference){
  #app.pg-in{animation:ngPage .45s var(--ng-ease) both}
  #app .rv{opacity:0}
  #app .rv-in{animation:ngRise .8s var(--ng-ease) var(--rv-d,0ms) both}
  #app img.img-fade{opacity:0}
  #app img.is-loaded{animation:ngFade .6s ease both}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
:root{--ng-focus:#4E5A42}
#app .hdr-sticky{background:rgba(250,247,242,.94);-webkit-backdrop-filter:saturate(1.3) blur(12px);backdrop-filter:saturate(1.3) blur(12px)}
#app .h-row{transition:padding .3s var(--ng-ease)}
#app .h-logo img{transition:width .3s var(--ng-ease),height .3s var(--ng-ease)}
@media (min-width:768px){
  #app.is-scrolled .h-row{padding-top:8px!important;padding-bottom:8px!important}
  #app.is-scrolled .h-logo img{width:48px!important;height:48px!important}
}
#app.is-scrolled .hdr-sticky{box-shadow:0 10px 28px -16px rgba(47,39,37,.28)}
/* Signature hero animations */
@keyframes ngWord{from{transform:translateY(110%)}}
@keyframes ngLine{from{transform:scaleX(0)}}
@keyframes ngDraw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.hw{display:inline-block;overflow:hidden;vertical-align:top;padding:0 .06em .16em;margin:0 -.06em -.16em}
.hw > span{display:inline-block}
@media (prefers-reduced-motion:no-preference){
  #app.hero-play .hw > span{animation:ngWord 1s var(--ng-ease) calc(var(--i,0) * var(--hw-step,70ms) + 120ms) both}
  #app.hero-play .hs{animation:ngRise .9s var(--ng-ease) var(--d,0ms) both}
}
/* Rotating hero photos (A and C) */
#app .ng-rot .ng-rot-slide{opacity:0;transition:opacity 1.2s ease}
#app .ng-rot .ng-rot-slide.is-active,#app .ng-rot:not(.is-ready) .ng-rot-slide:first-child{opacity:1}
#app .ng-rot.ng-instant .ng-rot-slide{transition:none}
#app .ng-rot img.ng-rot-slide.is-loaded{animation:none}
#app .ng-rot-dots{display:flex}
#app .ng-rot-dot{width:40px;height:32px;border:0;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
#app .ng-rot-dot span{position:relative;display:block;width:14px;height:2px;overflow:hidden;transition:width .45s var(--ng-ease)}
#app .ng-rot-dot.is-active span{width:32px}
#app .ng-rot-dot span::after{content:'';position:absolute;inset:0;transform:scaleX(0);transform-origin:left}
#app .ng-rot-dot.is-active span::after{transform:scaleX(1)}
@keyframes ngRotBar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes ngRotKen{from{scale:1.07}to{scale:1}}
@media (prefers-reduced-motion:no-preference){
  #app .ng-rot.is-auto .ng-rot-dot.is-active span::after{animation:ngRotBar 5.5s linear both}
  #app .ng-rot:hover .ng-rot-dot.is-active span::after,#app .ng-rot:focus-within .ng-rot-dot.is-active span::after{animation-play-state:paused}
  #app .ng-rot img.ng-rot-slide.is-active{animation:ngRotKen 8s ease-out both}
}
#app .bsl-stage{display:grid}
#app .bsl-slide{grid-area:1/1;opacity:0;visibility:hidden;transition:opacity .9s ease,visibility 0s linear .9s}
#app .bsl-slide.is-active,#app .bsl:not(.is-ready) .bsl-slide:first-child{opacity:1;visibility:visible;transition:opacity .9s ease}
#app .bsl-dot{width:52px;height:44px;border:0;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
#app .bsl-dot span{position:relative;display:block;width:16px;height:2px;background:rgba(47,39,37,.25);overflow:hidden;transition:width .45s var(--ng-ease)}
#app .bsl-dot.is-active span{width:40px}
#app .bsl-dot span::after{content:'';position:absolute;inset:0;background:#2F2725;transform:scaleX(0);transform-origin:left}
#app .bsl-dot.is-active span::after{transform:scaleX(1)}
@keyframes ngProgress{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes ngKenB{from{scale:1.1}}
@keyframes ngMarquee{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:no-preference){
  #app .bsl.is-auto .bsl-dot.is-active span::after{animation:ngProgress 6s linear both}
  #app .bsl:hover .bsl-dot.is-active span::after,#app .bsl:focus-within .bsl-dot.is-active span::after{animation-play-state:paused}
  #app .bsl-slide.is-active .bsl-media img{animation:ngKenB 7s ease-out both}
  #app .bsl-slide.is-active .bsl-txt > *{animation:ngRise .8s var(--ng-ease) both}
  #app .bsl-slide.is-active .bsl-txt > :nth-child(1){animation-delay:.15s}
  #app .bsl-slide.is-active .bsl-txt > :nth-child(2){animation-delay:.25s}
  #app .bsl-slide.is-active .bsl-txt > :nth-child(3){animation-delay:.37s}
  #app .bsl-slide.is-active .bsl-txt > :nth-child(4){animation-delay:.49s}
}
/* Brand marquee */
#app .mq{overflow:hidden;border-top:1px solid #E9DED6;border-bottom:1px solid #E9DED6;-webkit-mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent)}
#app .mq-track{display:flex;width:max-content}
#app .mq-set{display:flex}
#app[data-page] .mq .bl{flex:none;width:200px;min-height:104px;margin:0;border:0;border-right:1px solid #E9DED6}
@media (prefers-reduced-motion:no-preference){
  #app .mq-track{animation:ngMarquee 48s linear infinite}
  #app .mq:hover .mq-track,#app .mq:focus-within .mq-track{animation-play-state:paused}
}
@media (prefers-reduced-motion:reduce){
  #app .mq{-webkit-mask-image:none;mask-image:none}
  #app .mq-track{width:auto}
  #app .mq-set{flex-wrap:wrap;justify-content:center}
  #app .mq-set[aria-hidden="true"]{display:none}
}
@media (max-width:767px){#app[data-page] .mq .bl{width:150px;min-height:88px}}
@media (max-width:480px){#app .h-row > a > span > span:last-child,#app .h-logo > span > span:last-child{display:none!important}}

/* Palette 1: deep sage primary, gold detail */
#app[data-page] .btn-ink{background:#4E5A42;border-color:#4E5A42;color:#fff}
#app[data-page] .btn-ink:hover{background:#3F4A35;border-color:#3F4A35;color:#fff}
#app[data-page] .add:hover{background:#4E5A42;border-color:#4E5A42;color:#fff}
#app[data-page] .st h2::after{content:'';display:block;width:44px;height:1px;background:#BF9645;margin:14px auto 0}
:root{--ng-bg:#FAF7F2;--ng-card:#FFFFFF;--ng-ink:#2F2725;--ng-muted:#6E6460;--ng-line:#EADFDA;--ng-tile:#F8F0ED;--ng-tile2:#F8F0ED;
  --ng-pri:#4E5A42;--ng-pri-h:#3F4A35;--ng-pri-ink:#FFFFFF;--ng-gold:#BF9645;--ng-r:0px;--ng-r-sm:0px;--ng-btn-r:0;--ng-chip-r:0;--ng-field-r:0;
  --ng-head:'Jost','Noto Sans KR','Noto Sans KR',system-ui,sans-serif;--ng-head-w:300;--ng-head-ls:.02em;--ng-head-x:.9}
/* ===== Commerce layer: cart drawer,search panel,checkout ===== */
:root{--ng-ease:cubic-bezier(.2,.65,.25,1)}
.ng-shop{position:fixed;inset:0;z-index:1000;color:var(--ng-ink);font-family:'Jost','Noto Sans KR',system-ui,sans-serif;font-size:15px;line-height:1.5}
.ng-shop[hidden]{display:none}
.ng-shop *{box-sizing:border-box}
.ng-scrim,#app[data-page] .ng-scrim{position:absolute;inset:0;background:rgba(32,28,26,.36);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);opacity:0;transition:opacity .35s ease}
.ng-shop.is-open .ng-scrim{opacity:1}
.ng-h,#app[data-page] .ng-h{margin:0;font-family:var(--ng-head);font-weight:var(--ng-head-w);letter-spacing:var(--ng-head-ls);line-height:1.1;color:var(--ng-ink)}
.ng-eyebrow,#app[data-page] .ng-eyebrow{font-size:12px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--ng-muted)}
.ng-x,#app[data-page] .ng-x{flex:none;width:44px;height:44px;border:0;border-radius:50%;background:transparent;color:inherit;display:grid;place-items:center;cursor:pointer;transition:background-color .2s ease,transform .35s var(--ng-ease)}
.ng-x:hover,#app[data-page] .ng-x:hover{background:var(--ng-tile);transform:rotate(90deg)}
.ng-btn,#app[data-page] .ng-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:52px;padding:0 24px;border:1px solid var(--ng-pri);border-radius:var(--ng-btn-r);background:var(--ng-pri);color:var(--ng-pri-ink);font:inherit;font-size:13px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;cursor:pointer;transition:background-color .2s ease,border-color .2s ease,color .2s ease,transform .2s var(--ng-ease)}
.ng-btn:hover,#app[data-page] .ng-btn:hover{background:var(--ng-pri-h);border-color:var(--ng-pri-h)}
.ng-btn:active,#app[data-page] .ng-btn:active{transform:scale(.98)}
.ng-btn.ng-ghost,#app[data-page] .ng-btn.ng-ghost{background:transparent;color:var(--ng-pri)}
.ng-btn.ng-ghost:hover,#app[data-page] .ng-btn.ng-ghost:hover{background:var(--ng-pri);color:var(--ng-pri-ink)}
.ng-btn svg,#app[data-page] .ng-btn svg{flex:none;transition:transform .3s var(--ng-ease)}
.ng-btn:hover svg,#app[data-page] .ng-btn:hover svg{transform:translateX(4px)}
.ng-link,#app[data-page] .ng-link{background:none;border:0;padding:8px 0;color:var(--ng-muted);font:inherit;font-size:14px;text-decoration:underline;text-underline-offset:4px;cursor:pointer}
.ng-link:hover,#app[data-page] .ng-link:hover{color:var(--ng-ink)}
.ng-shop :focus-visible,#app[data-page="checkout"] .ck :focus-visible{outline:2px solid var(--ng-pri);outline-offset:3px}
/* Cart drawer */
.ng-panel{position:absolute;top:0;right:0;bottom:0;width:min(440px,100%);display:flex;flex-direction:column;background:var(--ng-bg);box-shadow:-30px 0 70px -40px rgba(0,0,0,.45);transform:translateX(104%);transition:transform .5s var(--ng-ease);outline:none}
.ng-shop.is-open .ng-panel{transform:none}
.ng-ph,#app[data-page] .ng-ph{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:22px 20px 18px 24px;border-bottom:1px solid var(--ng-line)}
.ng-ph .ng-h,#app[data-page] .ng-ph .ng-h{font-size:calc(30px * var(--ng-head-x))}
.ng-ph .ng-h small,#app[data-page] .ng-ph .ng-h small{font-family:'Jost','Noto Sans KR',system-ui,sans-serif;font-size:14px;font-weight:400;letter-spacing:0;color:var(--ng-muted);margin-left:6px}
.ng-ship,#app[data-page] .ng-ship{padding:14px 24px 16px;background:var(--ng-tile2);font-size:14px}
.ng-ship b,#app[data-page] .ng-ship b{font-weight:600}
.ng-bar,#app[data-page] .ng-bar{height:4px;margin-top:10px;border-radius:4px;background:rgba(47,39,37,.1);overflow:hidden}
.ng-bar span,#app[data-page] .ng-bar span{display:block;height:100%;width:calc(var(--p,0) * 100%);border-radius:inherit;background:linear-gradient(90deg,var(--ng-gold),var(--ng-pri));transition:width .7s var(--ng-ease)}
.ng-body,#app[data-page] .ng-body{flex:1;overflow:auto;padding:4px 24px 12px;overscroll-behavior:contain}
.ng-items,#app[data-page] .ng-items{list-style:none;margin:0;padding:0}
.ng-item,#app[data-page] .ng-item{display:grid;grid-template-columns:84px minmax(0,1fr);gap:16px;padding:18px 0;border-bottom:1px solid var(--ng-line)}
.ng-anim .ng-item,#app[data-page] .ng-anim .ng-item{animation:ngItemIn .55s var(--ng-ease) both;animation-delay:calc(var(--i,0) * 60ms + 120ms)}
@keyframes ngItemIn{from{opacity:0;transform:translateX(24px)}}
.ng-item.is-new .ng-thumb,#app[data-page] .ng-item.is-new .ng-thumb{animation:ngGlow 1.4s ease .25s}
@keyframes ngGlow{40%{box-shadow:0 0 0 4px color-mix(in srgb,var(--ng-gold) 45%,transparent)}}
.ng-item.is-leaving,#app[data-page] .ng-item.is-leaving{animation:ngItemOut .32s ease both}
@keyframes ngItemOut{to{opacity:0;transform:translateX(30px)}}
.ng-thumb,#app[data-page] .ng-thumb{display:grid;place-items:center;aspect-ratio:1/1;border-radius:var(--ng-r-sm);background:var(--ng-tile);overflow:hidden}
.ng-thumb img,#app[data-page] .ng-thumb img{width:80%;height:80%;object-fit:contain;mix-blend-mode:multiply}
.ng-info,#app[data-page] .ng-info{display:flex;flex-direction:column;gap:4px;min-width:0}
.ng-brand,#app[data-page] .ng-brand{font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--ng-muted)}
.ng-name,#app[data-page] .ng-name{font-size:15px;font-weight:500;line-height:1.35;color:var(--ng-ink);text-decoration:none}
.ng-row,#app[data-page] .ng-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:8px}
.ng-price,#app[data-page] .ng-price{font-size:15px;font-weight:600;white-space:nowrap}
.ng-price s,#app[data-page] .ng-price s{font-weight:400;color:var(--ng-muted);margin-right:6px;font-size:13px}
.ng-qty,#app[data-page] .ng-qty{display:inline-flex;align-items:center;border:1px solid var(--ng-line);border-radius:var(--ng-btn-r);background:var(--ng-card)}
.ng-qty button,#app[data-page] .ng-qty button{width:36px;height:36px;border:0;background:transparent;color:inherit;font:inherit;font-size:18px;line-height:1;cursor:pointer;border-radius:var(--ng-btn-r);transition:background-color .2s ease}
.ng-qty button:hover,#app[data-page] .ng-qty button:hover{background:var(--ng-tile)}
.ng-qty output,#app[data-page] .ng-qty output{min-width:28px;text-align:center;font-weight:500}
.ng-qty output.pop,#app[data-page] .ng-qty output.pop{animation:ngPop .35s var(--ng-ease)}
@keyframes ngPop{50%{transform:scale(1.35)}}
.ng-rm,#app[data-page] .ng-rm{align-self:flex-start;background:none;border:0;padding:4px 0;color:var(--ng-muted);font:inherit;font-size:13px;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.ng-rm:hover,#app[data-page] .ng-rm:hover{color:#9A3F2F}
.ng-pf,#app[data-page] .ng-pf{padding:18px 24px 22px;border-top:1px solid var(--ng-line);background:var(--ng-bg);display:grid;gap:12px}
.ng-total,#app[data-page] .ng-total{display:flex;align-items:baseline;justify-content:space-between;font-size:16px}
.ng-total b,#app[data-page] .ng-total b{font-family:var(--ng-head);font-weight:var(--ng-head-w);font-size:calc(28px * var(--ng-head-x))}
.ng-note,#app[data-page] .ng-note{margin:-6px 0 2px;font-size:13px;color:var(--ng-muted)}
.ng-pf .ng-link,#app[data-page] .ng-pf .ng-link{justify-self:center}
.ng-empty,#app[data-page] .ng-empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:40px 4px 12px}
.ng-empty-ic,#app[data-page] .ng-empty-ic{width:88px;height:88px;border-radius:50%;display:grid;place-items:center;background:var(--ng-tile);color:var(--ng-pri);animation:ngFloat 4s ease-in-out infinite}
@keyframes ngFloat{50%{transform:translateY(-6px)}}
.ng-empty .ng-h,#app[data-page] .ng-empty .ng-h{font-size:calc(26px * var(--ng-head-x))}
.ng-empty p,#app[data-page] .ng-empty p{margin:0;color:var(--ng-muted);max-width:300px}
.ng-sugg,#app[data-page] .ng-sugg{width:100%;margin-top:18px;text-align:left}
.ng-sugg .ng-eyebrow,#app[data-page] .ng-sugg .ng-eyebrow{display:block;margin-bottom:6px}
.ng-mini,#app[data-page] .ng-mini{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--ng-line)}
.ng-mini .ng-thumb,#app[data-page] .ng-mini .ng-thumb{border-radius:calc(var(--ng-r-sm) * .7)}
.ng-mini .ng-name,#app[data-page] .ng-mini .ng-name{font-size:14px}
.ng-plus,#app[data-page] .ng-plus{width:40px;height:40px;border:1px solid var(--ng-line);border-radius:var(--ng-btn-r);background:var(--ng-card);color:var(--ng-pri);display:grid;place-items:center;cursor:pointer;transition:background-color .2s ease,color .2s ease,border-color .2s ease}
.ng-plus:hover,#app[data-page] .ng-plus:hover{background:var(--ng-pri);border-color:var(--ng-pri);color:var(--ng-pri-ink)}
/* Cart badge in the header */
.ng-cart-open{position:relative}
.ng-badge{position:absolute;top:3px;right:1px;display:none;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--ng-gold);color:#fff;font-size:11px;font-weight:600;line-height:18px;text-align:center;pointer-events:none}
.ng-cart-open.has-items .ng-badge{display:block}
.ng-bump{animation:ngBump .6s var(--ng-ease)}
@keyframes ngBump{30%{transform:scale(1.45)}60%{transform:scale(.9)}}
/* Search panel */
.ng-sheet{position:absolute;left:0;right:0;top:0;max-height:min(90vh,780px);overflow:auto;background:var(--ng-bg);box-shadow:0 40px 80px -40px rgba(0,0,0,.45);transform:translateY(-104%);transition:transform .5s var(--ng-ease);overscroll-behavior:contain}
.ng-shop.is-open .ng-sheet{transform:none}
.ng-sheet-in,#app[data-page] .ng-sheet-in{max-width:1180px;margin:0 auto;padding:26px clamp(16px,4vw,56px) 34px}
.ng-sf,#app[data-page] .ng-sf{display:flex;align-items:center;gap:14px;padding:4px 0 10px;border-bottom:1px solid var(--ng-ink)}
.ng-sf > svg,#app[data-page] .ng-sf > svg{flex:none;color:var(--ng-muted)}
.ng-sf input,#app[data-page] .ng-sf input{flex:1;min-width:0;border:0;background:transparent;color:var(--ng-ink);font-family:var(--ng-head);font-weight:var(--ng-head-w);font-size:clamp(22px,3.2vw,34px);letter-spacing:var(--ng-head-ls);padding:8px 0;outline:none}
.ng-sf input::placeholder,#app[data-page] .ng-sf input::placeholder{color:var(--ng-muted);opacity:.6}
.ng-sf input::-webkit-search-cancel-button,#app[data-page] .ng-sf input::-webkit-search-cancel-button{display:none}
.ng-kbd,#app[data-page] .ng-kbd{flex:none;padding:2px 8px;border:1px solid var(--ng-line);border-radius:6px;font-size:12px;color:var(--ng-muted)}
.ng-sr,#app[data-page] .ng-sr{margin-top:22px;min-height:120px}
.ng-sr-head,#app[data-page] .ng-sr-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:0 0 12px}
.ng-chips,#app[data-page] .ng-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px}
.ng-chip,#app[data-page] .ng-chip{min-height:40px;padding:0 16px;border:1px solid var(--ng-line);border-radius:var(--ng-chip-r);background:var(--ng-card);color:var(--ng-ink);font:inherit;font-size:14px;cursor:pointer;transition:background-color .2s ease,border-color .2s ease,transform .2s var(--ng-ease)}
.ng-chip:hover,#app[data-page] .ng-chip:hover{background:var(--ng-tile);border-color:var(--ng-tile);transform:translateY(-2px)}
.ng-rs,#app[data-page] .ng-rs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(340px,100%),1fr));gap:4px 32px}
.ng-r,#app[data-page] .ng-r{display:grid;grid-template-columns:64px minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--ng-line);animation:ngItemIn .45s var(--ng-ease) both;animation-delay:calc(var(--i,0) * 40ms)}
.ng-r .ng-thumb,#app[data-page] .ng-r .ng-thumb{border-radius:calc(var(--ng-r-sm) * .7)}

  function renderCheckout() {
    var root = app.querySelector('.ck-root');
    if (!root) return;
    root.innerHTML = checkoutHTML();
  }
  function refreshCheckout() {
    var s = app.querySelector('.ck-sum');
    if (s) s.innerHTML = summaryHTML();
    var b = app.querySelector('.ck-form button[type="submit"]');
    if (b) b.innerHTML = F('Pagar {0}', [money(totals().total)]) + ICON.arrow;
    if (app.querySelector('.ck-root') && !cart.length && !ck.done) renderCheckout();
  }
  app.addEventListener('input', function (e) {
    var f = e.target.closest('.ck-form, .ck-sum');
    if (!f || !e.target.name) return;
    if (e.target.name === 'code') ck.code = e.target.value;
    else if (e.target.type === 'checkbox') ck.f[e.target.name] = e.target.checked;
    else ck.f[e.target.name] = e.target.value;
  });
  app.addEventListener('change', function (e) {
    var n = e.target.name;
    if (n === 'ship' || n === 'pay') { ck[n] = e.target.value; renderCheckout(); var r = app.querySelector('input[name="' + n + '"]:checked'); if (r) r.focus(); }
    else if (n === 'terms') ck.f.terms = e.target.checked;
  });
  app.addEventListener('click', function (e) {
    if (e.target.closest('[data-apply]')) {
      var code = (ck.code || '').trim().toUpperCase();
      if (code === CODE) { ck.applied = true; ck.msg = subtotal() >= CODE_MIN ? T('Código WELCOME10 aplicado: 10% de desconto.') : T('O código WELCOME10 aplica-se a compras acima de 10 €.'); }
      else { ck.applied = false; ck.msg = code ? T('Este código não é válido.') : T('Escreva um código de desconto.'); }
      refreshCheckout();
      return;
    }
    if (e.target.closest('[data-reset]')) { ck = { f: {}, ship: 'home', pay: 'mbway', code: '', applied: false, msg: '', done: null, tried: false }; }
  });
  app.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target.name === 'code') { e.preventDefault(); app.querySelector('[data-apply]').click(); }
  });
  app.addEventListener('submit', function (e) {
    var form = e.target.closest('.ck-form');
    if (!form) return;
    e.preventDefault();
    ck.tried = true;
    form.classList.add('was-validated');
    if (!form.checkValidity()) {
      var bad = form.querySelector(':invalid');
      if (bad) bad.focus();
      return;
    }
    ck.done = { email: ck.f.email || '', ref: 'NG-' + String(Math.floor(10000 + Math.random() * 90000)) };
    cart = []; persist(); badges(false);
    renderCheckout();
    window.scrollTo({ top: 0, behavior: mq.matches ? 'instant' : 'smooth' });
  });

  /* ---------- hooks ---------- */
  var prev = window.__ngAfterDraw;
  window.__ngAfterDraw = function (root, entering) {
    if (prev) prev(root, entering);
    badges(false);
    if (app.getAttribute('data-page') === 'checkout') renderCheckout();
    else if (ck.done && entering) ck = { f: {}, ship: 'home', pay: 'mbway', code: '', applied: false, msg: '', done: null, tried: false };
    if (entering) { hide(drawer, true); hide(search, true); }
  };
  document.addEventListener('ng-lang', function () {
    if (!drawer.hidden) renderCart(false);
    if (!search.hidden) { renderSearch(); search.querySelector('.ng-sf input').focus(); }
  });
  window.__ngCart = { add: add, open: openCart, items: function () { return cart.slice(); } };
})();

<script>
(function () {
  var app = document.getElementById('app');
  var D = window.__NG_I18N || { en: {}, ko: {} };
  var LANGS = [['pt', 'pt-PT', 'Português', 'PT'], ['en', 'en', 'English', 'EN'], ['ko', 'ko', '한국어', 'KO']];
  var LABEL = { pt: 'Idioma', en: 'Language', ko: '언어' };
  var LETTER = /[A-Za-zÀ-ÿ\u3131-\uD79D]/;

  function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
  function price(s) { return s.replace(/(\d+),(\d{2})\s?€/g, '€$1.$2').replace(/(\d+)\s?€/g, '€$1'); }

    return null;
  }

    var core = s.replace(/\s+/g, ' ').trim();
    if (!core) return null;
    var lead = /^\s*/.exec(s)[0] ? ' ' : '', trail = /\s*$/.exec(s)[0] ? ' ' : '';
    if (!LETTER.test(core)) { var p = price(core); return p !== core ? lead + p + trail : null; }
    var t = lookup(core, dict);
    if (t == null) { if (!quiet) miss(core); return null; }
    return lead + price(t.replace(/<\/?em>/g, '')) + trail;
  }

    for (var i = 0; i < ATTRS.length; i++) {
      var v = el.getAttribute(ATTRS[i]);
      if (!v || !LETTER.test(v)) continue;
      var t = text(v, dict);
      if (t != null) el.setAttribute(ATTRS[i], t.trim());
    }

  /* A sentence with inline markup becomes one key: "Envio grátis acima de <a>50 €</a>" */
  function mixedKey(el) {
    var key = '', els = [], words = false;
    for (var n = el.firstChild; n; n = n.nextSibling) {
      if (n.nodeType === 3) key += n.nodeValue;
      else if (n.nodeType === 1) {

        if (n.children.length && tx.trim()) return null;
        if (tx.trim()) words = true;
        els.push(n);
        key += tx.trim() ? '<' + id + '>' + tx + '</' + id + '>' : '<' + id + '/>';
      }
    }
    return words ? { key: key.replace(/\s+/g, ' ').trim(), els: els } : null;
  }

  function applyMixed(el, m, t) {
    var out = [], used = {}, re = /<([a-z])\/>|<([a-z])>([\s\S]*?)<\/\2>|([^<]+)/g, x;
    while ((x = re.exec(t))) {
      if (x[4] != null) { out.push(document.createTextNode(price(x[4]))); continue; }
      var id = x[1] || x[2], node = m.els[id.charCodeAt(0) - 97];
      if (!node || used[id]) continue;
      used[id] = 1;
      if (x[2]) node.textContent = price(x[3]);
      out.push(node);
    }
    el.replaceChildren.apply(el, out);

  }

  document.addEventListener('click', function (e) {
    var t = e.target.closest ? e.target : null;

    var btn = t.closest('.ng-lang-btn');

  document.addEventListener('keydown', function (e) {
    var menu = e.target.closest && e.target.closest('.ng-lang-menu');
    if (e.key === 'Escape' && app.querySelector('.ng-lang.is-open')) { close(true); return; }

  function apply() {
    document.documentElement.lang = current()[1];
    if (document.title !== setTitle) ptTitle = document.title;
    mountSwitcher();
    if (lang === 'pt') { document.title = setTitle = ptTitle; return; }
    var dict = D[lang];
    walk(app, dict);
    document.title = setTitle = ptTitle.split(' · ').map(function (p) {
      var t = lookup(p, dict);

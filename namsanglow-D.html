:root{--ng-ease:cubic-bezier(.2,.65,.25,1)}
#app [id]{scroll-margin-top:calc(var(--hdr-h,0px) + 16px)}

/* Hover and press feedback (zero specificity: design rules still win) */
:where(#app) :where(a,button,summary,input,select,textarea){transition:color .2s ease,background-color .2s ease,border-color .2s ease,box-shadow .25s ease,opacity .2s ease,transform .2s var(--ng-ease)}
:where(#app) :where(.btn,.add,.arr,.tg,.tab,.menu,.step,button.st,.nav-toggle,.icon,.ic,.fav):active{transform:scale(.97)}

/* Keyboard focus */
:where(#app) :focus-visible{outline:2px solid var(--ng-focus);outline-offset:3px}
:where(#app) :where(footer,[style*="background:#2A211A"],[style*="background:#1C1A19"],[style*="background:#3B2D22"]) :focus-visible{outline-color:#fff}

/* Sticky header */
.hdr-sticky{position:sticky;top:0;z-index:40;transition:transform .35s var(--ng-ease),box-shadow .3s ease,padding .3s var(--ng-ease),background-color .3s ease}
@media (max-width:767px){#app.hdr-hide:not(.nav-open) .hdr-sticky{transform:translateY(-110%)}}

/* Page, section and image entrances */
@keyframes ngPage{from{opacity:0}}
@keyframes ngRise{from{opacity:0;transform:translateY(22px)}}
@keyframes ngFade{from{opacity:0}}
@media (prefers-reduced-motion:no-preference){
  #app.pg-in{animation:ngPage .45s var(--ng-ease) both}
  #app .rv{opacity:0}
  #app .rv-in{animation:ngRise .8s var(--ng-ease) var(--rv-d,0ms) both}
  #app img.img-fade{opacity:0}
  #app img.is-loaded{animation:ngFade .6s ease both}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}

@keyframes ngWord{from{transform:translateY(110%)}}

#app .ng-rot-dot span::after{content:'';position:absolute;inset:0;transform:scaleX(0);transform-origin:left}

  #app.hero-play img.c-prod{animation:ngRise 1s var(--ng-ease) calc(.55s + var(--k) * .16s) both,ngBob var(--bob,6s) ease-in-out var(--bd,0s) infinite}
  #app.hero-play .c-orn path{stroke-dasharray:1;animation:ngDraw 1.1s ease .75s both}
}
/* Routine steps lighting up along a gold line */
#app .rt-steps{position:relative;z-index:0}
#app .rt-steps::before,#app .rt-steps::after{content:'';position:absolute;left:119px;top:48px;bottom:48px;width:2px;z-index:-1;border-radius:2px}
#app .rt-steps::before{background:rgba(184,145,63,.25)}
#app .rt-steps::after{background:#B8913F;transform-origin:top;transform:scaleY(var(--p,1))}
#app .rt-steps.js-on li{transition:opacity .5s ease,transform .5s var(--ng-ease)}
#app .rt-steps.js-on li:not(.on){opacity:.45;transform:translateX(10px)}
#app .rt-steps li > a > span:nth-child(2){transition:background-color .4s ease,color .4s ease}
#app .rt-steps.js-on li.on > a > span:nth-child(2){background:#B8913F;color:#fff!important}
/* Pills to match the rounded header and arches */
#app[data-page] .btn,#app[data-page] .menu,#app[data-page] .tg,#app[data-page] .tab{border-radius:999px}
#app[data-page] .step{border-radius:50%}
#app .add{border-radius:999px}

/* Numbers without circles */
#app .num{border:0!important;border-radius:0!important;background:none!important;width:auto!important;height:auto!important;justify-content:flex-start!important;line-height:1}
#app .rail .num{font-size:42px!important}
@media (min-width:1100px){#app .rail{grid-template-columns:repeat(5,minmax(0,1fr))!important}}

/* Calmer hero headline */
#app h1.hl-lines{font-size:clamp(40px,4.6vw,64px)!important}
#app :has(> h1.hl-lines){flex:1.45 1 520px!important}

/* Carousel: arrows instead of the grey scrollbar */
#app .scroll{scrollbar-width:none;scroll-behavior:smooth}
#app .scroll::-webkit-scrollbar{display:none}
#app .sc-ctl{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
#app .sc-btn{width:48px;height:48px;border-radius:50%;border:1px solid #3B2D22;background:transparent;color:#3B2D22;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
#app .sc-btn:hover{background:#3B2D22;color:#F5EEE3}
#app .sc-btn[disabled]{opacity:.3;cursor:default;background:transparent;color:#3B2D22}
#app .sc-ctl > a{margin-right:8px}

/* Ritual timeline */
@media (min-width:900px){#app #rotina > div > div:first-child{position:sticky;top:calc(var(--hdr-h,90px) + 40px)}}
#app .rt-steps{gap:0!important}
#app .rt-steps li{position:relative;padding-left:44px}
#app .rt-steps li > a{background:transparent!important;border-radius:0!important;padding:28px 4px 28px 0!important;gap:28px!important;min-height:0!important;border-bottom:1px solid rgba(184,145,63,.3)}
#app .rt-steps li:first-child > a{border-top:1px solid rgba(184,145,63,.3)}
#app .rt-steps li > a > span.num:nth-child(2){order:-1;font-size:clamp(46px,5vw,76px)!important;color:transparent!important;-webkit-text-stroke:1px #B8913F;min-width:1.45em;transition:color .6s ease,text-shadow .6s ease}
#app .rt-steps.js-on li.on > a > span.num:nth-child(2),#app .rt-steps:not(.js-on) li > a > span.num:nth-child(2){color:#B8913F!important;background:none!important}
#app .rt-steps li > a > span:first-child{width:96px!important;height:120px!important;border-radius:48px 48px 16px 16px!important;background:rgba(255,255,255,.82)!important;transition:transform .7s var(--ng-ease),opacity .7s ease,background-color .6s ease}
#app .rt-steps.js-on li:not(.on){opacity:.55;transform:none}
#app .rt-steps.js-on li:not(.on) > a > span:first-child{transform:translateY(18px);opacity:.6}
#app .rt-steps li > a > span:nth-child(3) > span:last-child{font-size:21px!important}
#app .rt-steps li > a > span:last-child{font-size:26px!important}
#app .rt-steps li::before{content:'';position:absolute;left:3px;top:50%;width:9px;height:9px;transform:translateY(-50%) rotate(45deg);border:1px solid #B8913F;background:var(--rt-bg,#E6E9DB);transition:background-color .5s ease,box-shadow .5s ease;z-index:1}
#app .rt-steps li.on::before,#app .rt-steps:not(.js-on) li::before{background:#B8913F;box-shadow:0 0 0 5px rgba(184,145,63,.18)}
#app .rt-steps::before,#app .rt-steps::after{left:7px!important;width:1px!important;top:var(--lt,60px)!important;bottom:var(--lb,60px)!important}
#app .rt-steps::after{box-shadow:0 0 10px rgba(184,145,63,.7)}
#app #rotina:has(.tg:nth-of-type(2)[aria-pressed="true"]) .rt-steps li.on > a > span.num:nth-child(2){text-shadow:0 0 30px rgba(214,178,98,.55)}
#app #rotina:has(.tg:nth-of-type(2)[aria-pressed="true"]) .rt-steps li > a > span:first-child{background:rgba(255,255,255,.1)!important}
@media (max-width:767px){
  #app .rt-steps li{padding-left:30px}
  #app .rt-steps li > a{flex-wrap:wrap;gap:14px 18px!important;padding:22px 0!important}
  #app .rt-steps li > a > span.num:nth-child(2){font-size:44px!important;min-width:1.3em}
  #app .rt-steps li > a > span:first-child{width:72px!important;height:92px!important}
  #app .rt-steps li > a > span:nth-child(3){flex:1 1 150px!important}
  #app .rt-steps li > a > span:last-child{margin-left:auto;font-size:22px!important}
}
:root{--ng-bg:#F5EEE3;--ng-card:#FFFFFF;--ng-ink:#3B2D22;--ng-muted:#6E604F;--ng-line:#E6DACA;--ng-tile:#F0DCD7;--ng-tile2:#E6E9DB;
  --ng-pri:#3B2D22;--ng-pri-h:#2B2018;--ng-pri-ink:#F5EEE3;--ng-gold:#B8913F;--ng-r:24px;--ng-r-sm:18px;--ng-btn-r:999px;--ng-chip-r:999px;--ng-field-r:16px;
  --ng-head:'Marcellus','Noto Serif KR','Noto Serif KR',Georgia,serif;--ng-head-w:400;--ng-head-ls:.01em;--ng-head-x:1}
/* ===== Commerce layer: cart drawer,search panel,checkout ===== */
:root{--ng-ease:cubic-bezier(.2,.65,.25,1)}
.ng-shop{position:fixed;inset:0;z-index:1000;color:var(--ng-ink);font-family:'Jost','Noto Sans KR',system-ui,sans-serif;font-size:15px;line-height:1.5}
.ng-shop[hidden]{display:none}
.ng-shop *{box-sizing:border-box}
.ng-scrim,#app[data-page] .ng-scrim{position:absolute;inset:0;background:rgba(32,28,26,.36);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);opacity:0;transition:opacity .35s ease}
.ng-shop.is-open .ng-scrim{opacity:1}
.ng-h,#app[data-page] .ng-h{margin:0;font-family:var(--ng-head);font-weight:var(--ng-head-w);letter-spacing:var(--ng-head-ls);line-height:1.1;color:var(--ng-ink)}
.ng-eyebrow,#app[data-page] .ng-eyebrow{font-size:12px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--ng-muted)}
.ng-x,#app[data-page] .ng-x{flex:none;width:44px;height:44px;border:0;border-radius:50%;background:transparent;color:inherit;display:grid;place-items:center;cursor:pointer;transition:background-color .2s ease,transform .35s var(--ng-ease)}
.ng-x:hover,#app[data-page] .ng-x:hover{background:var(--ng-tile);transform:rotate(90deg)}
.ng-btn,#app[data-page] .ng-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:52px;padding:0 24px;border:1px solid var(--ng-pri);border-radius:var(--ng-btn-r);background:var(--ng-pri);color:var(--ng-pri-ink);font:inherit;font-size:13px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;cursor:pointer;transition:background-color .2s ease,border-color .2s ease,color .2s ease,transform .2s var(--ng-ease)}
.ng-btn:hover,#app[data-page] .ng-btn:hover{background:var(--ng-pri-h);border-color:var(--ng-pri-h)}
.ng-btn:active,#app[data-page] .ng-btn:active{transform:scale(.98)}
.ng-btn.ng-ghost,#app[data-page] .ng-btn.ng-ghost{background:transparent;color:var(--ng-pri)}
.ng-btn.ng-ghost:hover,#app[data-page] .ng-btn.ng-ghost:hover{background:var(--ng-pri);color:var(--ng-pri-ink)}
.ng-btn svg,#app[data-page] .ng-btn svg{flex:none;transition:transform .3s var(--ng-ease)}
.ng-btn:hover svg,#app[data-page] .ng-btn:hover svg{transform:translateX(4px)}
.ng-link,#app[data-page] .ng-link{background:none;border:0;padding:8px 0;color:var(--ng-muted);font:inherit;font-size:14px;text-decoration:underline;text-underline-offset:4px;cursor:pointer}
.ng-link:hover,#app[data-page] .ng-link:hover{color:var(--ng-ink)}
.ng-shop :focus-visible,#app[data-page="checkout"] .ck :focus-visible{outline:2px solid var(--ng-pri);outline-offset:3px}
/* Cart drawer */
.ng-panel{position:absolute;top:0;right:0;bottom:0;width:min(440px,100%);display:flex;flex-direction:column;background:var(--ng-bg);box-shadow:-30px 0 70px -40px rgba(0,0,0,.45);transform:translateX(104%);transition:transform .5s var(--ng-ease);outline:none}
.ng-shop.is-open .ng-panel{transform:none}
.ng-ph,#app[data-page] .ng-ph{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:22px 20px 18px 24px;border-bottom:1px solid var(--ng-line)}
.ng-ph .ng-h,#app[data-page] .ng-ph .ng-h{font-size:calc(30px * var(--ng-head-x))}
.ng-ph .ng-h small,#app[data-page] .ng-ph .ng-h small{font-family:'Jost','Noto Sans KR',system-ui,sans-serif;font-size:14px;font-weight:400;letter-spacing:0;color:var(--ng-muted);margin-left:6px}
.ng-ship,#app[data-page] .ng-ship{padding:14px 24px 16px;background:var(--ng-tile2);font-size:14px}
.ng-ship b,#app[data-page] .ng-ship b{font-weight:600}
.ng-bar,#app[data-page] .ng-bar{height:4px;margin-top:10px;border-radius:4px;background:rgba(47,39,37,.1);overflow:hidden}
.ng-bar span,#app[data-page] .ng-bar span{display:block;height:100%;width:calc(var(--p,0) * 100%);border-radius:inherit;background:linear-gradient(90deg,var(--ng-gold),var(--ng-pri));transition:width .7s var(--ng-ease)}
.ng-body,#app[data-page] .ng-body{flex:1;overflow:auto;padding:4px 24px 12px;overscroll-behavior:contain}
.ng-items,#app[data-page] .ng-items{list-style:none;margin:0;padding:0}
.ng-item,#app[data-page] .ng-item{display:grid;grid-template-columns:84px minmax(0,1fr);gap:16px;padding:18px 0;border-bottom:1px solid var(--ng-line)}
.ng-anim .ng-item,#app[data-page] .ng-anim .ng-item{animation:ngItemIn .55s var(--ng-ease) both;animation-delay:calc(var(--i,0) * 60ms + 120ms)}
@keyframes ngItemIn{from{opacity:0;transform:translateX(24px)}}
.ng-item.is-new .ng-thumb,#app[data-page] .ng-item.is-new .ng-thumb{animation:ngGlow 1.4s ease .25s}
@keyframes ngGlow{40%{box-shadow:0 0 0 4px color-mix(in srgb,var(--ng-gold) 45%,transparent)}}
.ng-item.is-leaving,#app[data-page] .ng-item.is-leaving{animation:ngItemOut .32s ease both}
@keyframes ngItemOut{to{opacity:0;transform:translateX(30px)}}
.ng-thumb,#app[data-page] .ng-thumb{display:grid;place-items:center;aspect-ratio:1/1;border-radius:var(--ng-r-sm);background:var(--ng-tile);overflow:hidden}
.ng-thumb img,#app[data-page] .ng-thumb img{width:80%;height:80%;object-fit:contain;mix-blend-mode:multiply}
.ng-info,#app[data-page] .ng-info{display:flex;flex-direction:column;gap:4px;min-width:0}
.ng-brand,#app[data-page] .ng-brand{font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--ng-muted)}
.ng-name,#app[data-page] .ng-name{font-size:15px;font-weight:500;line-height:1.35;color:var(--ng-ink);text-decoration:none}
.ng-row,#app[data-page] .ng-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:8px}
.ng-price,#app[data-page] .ng-price{font-size:15px;font-weight:600;white-space:nowrap}
.ng-price s,#app[data-page] .ng-price s{font-weight:400;color:var(--ng-muted);margin-right:6px;font-size:13px}
.ng-qty,#app[data-page] .ng-qty{display:inline-flex;align-items:center;border:1px solid var(--ng-line);border-radius:var(--ng-btn-r);background:var(--ng-card)}
.ng-qty button,#app[data-page] .ng-qty button{width:36px;height:36px;border:0;background:transparent;color:inherit;font:inherit;font-size:18px;line-height:1;cursor:pointer;border-radius:var(--ng-btn-r);transition:background-color .2s ease}
.ng-qty button:hover,#app[data-page] .ng-qty button:hover{background:var(--ng-tile)}
.ng-qty output,#app[data-page] .ng-qty output{min-width:28px;text-align:center;font-weight:500}
.ng-qty output.pop,#app[data-page] .ng-qty output.pop{animation:ngPop .35s var(--ng-ease)}
@keyframes ngPop{50%{transform:scale(1.35)}}
.ng-rm,#app[data-page] .ng-rm{align-self:flex-start;background:none;border:0;padding:4px 0;color:var(--ng-muted);font:inherit;font-size:13px;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.ng-rm:hover,#app[data-page] .ng-rm:hover{color:#9A3F2F}
.ng-pf,#app[data-page] .ng-pf{padding:18px 24px 22px;border-top:1px solid var(--ng-line);background:var(--ng-bg);display:grid;gap:12px}
.ng-total,#app[data-page] .ng-total{display:flex;align-items:baseline;justify-content:space-between;font-size:16px}
.ng-total b,#app[data-page] .ng-total b{font-family:var(--ng-head);font-weight:var(--ng-head-w);font-size:calc(28px * var(--ng-head-x))}
.ng-note,#app[data-page] .ng-note{margin:-6px 0 2px;font-size:13px;color:var(--ng-muted)}
.ng-pf .ng-link,#app[data-page] .ng-pf .ng-link{justify-self:center}
.ng-empty,#app[data-page] .ng-empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:40px 4px 12px}
.ng-empty-ic,#app[data-page] .ng-empty-ic{width:88px;height:88px;border-radius:50%;display:grid;place-items:center;background:var(--ng-tile);color:var(--ng-pri);animation:ngFloat 4s ease-in-out infinite}
@keyframes ngFloat{50%{transform:translateY(-6px)}}
.ng-empty .ng-h,#app[data-page] .ng-empty .ng-h{font-size:calc(26px * var(--ng-head-x))}
.ng-empty p,#app[data-page] .ng-empty p{margin:0;color:var(--ng-muted);max-width:300px}
.ng-sugg,#app[data-page] .ng-sugg{width:100%;margin-top:18px;text-align:left}
.ng-sugg .ng-eyebrow,#app[data-page] .ng-sugg .ng-eyebrow{display:block;margin-bottom:6px}
.ng-mini,#app[data-page] .ng-mini{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--ng-line)}
.ng-mini .ng-thumb,#app[data-page] .ng-mini .ng-thumb{border-radius:calc(var(--ng-r-sm) * .7)}
.ng-mini .ng-name,#app[data-page] .ng-mini .ng-name{font-size:14px}
.ng-plus,#app[data-page] .ng-plus{width:40px;height:40px;border:1px solid var(--ng-line);border-radius:var(--ng-btn-r);background:var(--ng-card);color:var(--ng-pri);display:grid;place-items:center;cursor:pointer;transition:background-color .2s ease,color .2s ease,border-color .2s ease}
.ng-plus:hover,#app[data-page] .ng-plus:hover{background:var(--ng-pri);border-color:var(--ng-pri);color:var(--ng-pri-ink)}
/* Cart badge in the header */
.ng-cart-open{position:relative}
.ng-badge{position:absolute;top:3px;right:1px;display:none;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--ng-gold);color:#fff;font-size:11px;font-weight:600;line-height:18px;text-align:center;pointer-events:none}
.ng-cart-open.has-items .ng-badge{display:block}
.ng-bump{animation:ngBump .6s var(--ng-ease)}
@keyframes ngBump{30%{transform:scale(1.45)}60%{transform:scale(.9)}}
/* Search panel */
.ng-sheet{position:absolute;left:0;right:0;top:0;max-height:min(90vh,780px);overflow:auto;background:var(--ng-bg);box-shadow:0 40px 80px -40px rgba(0,0,0,.45);transform:translateY(-104%);transition:transform .5s var(--ng-ease);overscroll-behavior:contain}
.ng-shop.is-open .ng-sheet{transform:none}
.ng-sheet-in,#app[data-page] .ng-sheet-in{max-width:1180px;margin:0 auto;padding:26px clamp(16px,4vw,56px) 34px}
.ng-sf,#app[data-page] .ng-sf{display:flex;align-items:center;gap:14px;padding:4px 0 10px;border-bottom:1px solid var(--ng-ink)}
.ng-sf > svg,#app[data-page] .ng-sf > svg{flex:none;color:var(--ng-muted)}
.ng-sf input,#app[data-page] .ng-sf input{flex:1;min-width:0;border:0;background:transparent;color:var(--ng-ink);font-family:var(--ng-head);font-weight:var(--ng-head-w);font-size:clamp(22px,3.2vw,34px);letter-spacing:var(--ng-head-ls);padding:8px 0;outline:none}
.ng-sf input::placeholder,#app[data-page] .ng-sf input::placeholder{color:var(--ng-muted);opacity:.6}
.ng-sf input::-webkit-search-cancel-button,#app[data-page] .ng-sf input::-webkit-search-cancel-button{display:none}
.ng-kbd,#app[data-page] .ng-kbd{flex:none;padding:2px 8px;border:1px solid var(--ng-line);border-radius:6px;font-size:12px;color:var(--ng-muted)}
.ng-sr,#app[data-page] .ng-sr{margin-top:22px;min-height:120px}
.ng-sr-head,#app[data-page] .ng-sr-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:0 0 12px}
.ng-chips,#app[data-page] .ng-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px}
.ng-chip,#app[data-page] .ng-chip{min-height:40px;padding:0 16px;border:1px solid var(--ng-line);border-radius:var(--ng-chip-r);background:var(--ng-card);color:var(--ng-ink);font:inherit;font-size:14px;cursor:pointer;transition:background-color .2s ease,border-color .2s ease,transform .2s var(--ng-ease)}
.ng-chip:hover,#app[data-page] .ng-chip:hover{background:var(--ng-tile);border-color:var(--ng-tile);transform:translateY(-2px)}
.ng-rs,#app[data-page] .ng-rs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(340px,100%),1fr));gap:4px 32px}
.ng-r,#app[data-page] .ng-r{display:grid;grid-template-columns:64px minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--ng-line);animation:ngItemIn .45s var(--ng-ease) both;animation-delay:calc(var(--i,0) * 40ms)}
.ng-r .ng-thumb,#app[data-page] .ng-r .ng-thumb{border-radius:calc(var(--ng-r-sm) * .7)}
.ng-r a,#app[data-page] .ng-r a{color:inherit;text-decoration:none}
.ng-r a:hover .ng-name,#app[data-page] .ng-r a:hover .ng-name{text-decoration:underline;text-underline-offset:3px}
.ng-r mark,#app[data-page] .ng-r mark{background:linear-gradient(transparent 62%,color-mix(in srgb,var(--ng-gold) 35%,transparent) 62%);color:inherit}
.ng-none,#app[data-page] .ng-none{padding:16px 0 8px;color:var(--ng-muted)}
.ng-none b,#app[data-page] .ng-none b{color:var(--ng-ink)}
.ng-sr-foot,#app[data-page] .ng-sr-foot{display:flex;justify-content:flex-end;margin-top:18px}
.ng-sr-foot .ng-btn,#app[data-page] .ng-sr-foot .ng-btn{width:auto}
/* B: a real search field instead of a bare underline */
#app form.ng-search-form{position:relative;height:46px;padding:0 14px;gap:4px;border:1px solid var(--ng-line)!important;background:var(--ng-card);cursor:text;transition:border-color .2s ease,box-shadow .2s ease}
#app form.ng-search-form:hover{border-color:#CDBFB6!important}
#app form.ng-search-form:focus-within{border-color:var(--ng-pri)!important;box-shadow:0 0 0 3px color-mix(in srgb,var(--ng-pri) 14%,transparent)}
#app form.ng-search-form input{height:100%;background:transparent;font:inherit;font-size:15px;color:var(--ng-ink);outline:none}
#app form.ng-search-form::after{content:'/';position:absolute;right:10px;top:50%;translate:0 -50%;padding:0 7px;border:1px solid var(--ng-line);border-radius:5px;font-size:12px;line-height:20px;color:var(--ng-muted)}
@media (max-width:767px){#app form.ng-search-form::after{display:none}}
/* Checkout */
.ck{max-width:1200px;margin:0 auto;padding:36px clamp(16px,4vw,56px) 96px;box-sizing:border-box;color:var(--ng-ink)}
#app[data-page="checkout"] .ck *{box-sizing:border-box}
#app[data-page="checkout"] .ck-back{display:inline-flex;align-items:center;gap:8px;min-height:44px;color:var(--ng-muted);font-size:14px;text-decoration:none}
#app[data-page="checkout"] .ck-back:hover{color:var(--ng-ink)}
#app[data-page="checkout"] .ck-back svg{transition:transform .3s var(--ng-ease)}

/* Quiz section: gold day, espresso night */
#app .qz-sec{--rc-bg:radial-gradient(120% 90% at 100% 0,#5A452F 0,#3B2D22 55%,#2A1F17 100%);--rc-fg:#F5EEE3;--rc-mut:rgba(245,238,227,.66);--rc-ln:rgba(214,181,102,.28);--rc-box:#FFFDF8;--rc-k:#D6B566;--rc-ic:#B8913F;--rc-icfg:#2A211A;
  position:relative;margin-top:96px;overflow:hidden;isolation:isolate;color:#2A211A;background:linear-gradient(160deg,#F6EAD1 0,#EBD6A8 55%,#E2C78C 100%)}
#app .qz-sec::before{content:'';position:absolute;inset:0;z-index:-2;background:linear-gradient(160deg,#4B3A2C 0,#33261C 55%,#241A13 100%);opacity:0;transition:opacity .8s ease}
#app .qz-sec[data-mode="night"]{color:#F5EEE3;--rc-bg:linear-gradient(160deg,#FFFDF8 0,#F6EAD1 100%);--rc-fg:#2A211A;--rc-mut:#6E604F;--rc-ln:rgba(184,145,63,.4);--rc-box:#F3E6CB;--rc-k:#7A5C1E}
#app .qz-sec[data-mode="night"]::before{opacity:1}
#app .qz-wrap{max-width:1328px;margin:0 auto;padding:96px clamp(16px,4vw,56px);box-sizing:border-box;display:flex;flex-direction:column;gap:44px}
#app .qz-intro{display:flex;flex-direction:column;gap:18px;max-width:780px}
#app #rotina .qz-wrap > .qz-intro{position:static!important}
#app .qz-intro .ey{color:#7A5C1E}
#app .qz-sec[data-mode="night"] .qz-intro .ey{color:#D6B566}
#app .qz-h{margin:0;font-size:clamp(40px,4.8vw,68px);line-height:1.04}
#app .qz-lead{margin:0;font-size:18px;line-height:1.6;max-width:520px;opacity:.78}
/* the sun, or the moon at night */
#app .qz-orb{position:absolute;z-index:-1;right:clamp(24px,9vw,150px);top:84px;width:clamp(72px,9vw,128px);aspect-ratio:1;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 36% 34%,#FFF7E2 0,#EFD596 52%,#C79B45 100%);box-shadow:0 0 0 16px rgba(184,145,63,.14),0 0 0 40px rgba(184,145,63,.08),0 0 90px 24px rgba(233,203,134,.55)}
#app .qz-sec[data-mode="night"] .qz-orb{background:transparent;box-shadow:inset -26px -6px 0 0 #F3E6CB,0 0 90px 10px rgba(243,230,203,.22)}
/* the quiz card */
#app .qz-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;align-items:stretch}
@media (min-width:960px){#app .qz-grid{grid-template-columns:minmax(0,1.02fr) minmax(0,1fr);gap:28px}}
#app .qz-card{display:flex;flex-direction:column;gap:22px;min-height:540px;padding:clamp(22px,3vw,40px);box-sizing:border-box;color:#2A211A;background:#FFFDF8;border:1px solid rgba(184,145,63,.42);border-radius:32px;box-shadow:0 36px 70px -44px rgba(59,45,34,.6)}
#app .qz-top{display:flex;align-items:center;gap:16px}
#app .qz-prog{flex:1;display:flex;gap:6px}
#app .qz-prog span{flex:1;height:4px;border-radius:2px;background:rgba(184,145,63,.24);position:relative;overflow:hidden}
#app .qz-prog span::after{content:'';position:absolute;inset:0;background:#B8913F;transform:scaleX(0);transform-origin:left;transition:transform .7s var(--ng-ease)}
#app .qz-prog span.done::after{transform:none}
#app .qz-prog span.cur::after{transform:scaleX(.42)}
#app .qz-count{flex:none;font-size:12px;font-weight:500;letter-spacing:.16em;color:#7A5C1E}
#app .qz-stage{flex:1;display:flex;flex-direction:column}
#app .qz-kicker{font-size:12px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:#7A5C1E}
#app .qz-title{margin:8px 0 24px;font-size:clamp(30px,3.1vw,44px);line-height:1.08;color:#3B2D22;outline:none}
#app .qz-card{container-type:inline-size}
#app .qz-opts{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
@container (min-width:560px){#app .qz-opts{grid-template-columns:repeat(2,minmax(0,1fr))}}
#app .qz-opt{position:relative;display:flex;align-items:center;gap:14px;min-height:86px;padding:14px 16px;box-sizing:border-box;text-align:left;font:inherit;color:#2A211A;background:#fff;border:1px solid rgba(184,145,63,.42);border-radius:24px;cursor:pointer;transition:transform .3s var(--ng-ease),box-shadow .3s,border-color .25s,background-color .3s,color .3s}
#app .qz-opt:hover{border-color:#B8913F;transform:translateY(-3px);box-shadow:0 18px 30px -22px rgba(59,45,34,.6)}
#app .qz-opt:focus-visible,#app .qz-ans:focus-visible,#app .qz-link:focus-visible{outline:2px solid #B8913F;outline-offset:3px}
#app .qz-ic{flex:none;position:relative;width:46px;height:46px;border-radius:50%;background:#F3E6CB;transition:background-color .3s}
#app .qz-ic::before{content:'';position:absolute;inset:11px;background:#7A5C1E;-webkit-mask:var(--ic) center/contain no-repeat;mask:var(--ic) center/contain no-repeat;transition:background-color .3s}
#app .qz-opt:hover .qz-ic{background:#EBD6A8}
#app .qz-ot{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
#app .qz-on{font-size:17px;font-weight:500;line-height:1.2}
#app .qz-oh{font-size:13px;line-height:1.4;opacity:.7}
#app .qz-ck{flex:none;position:relative;width:22px;height:22px;border-radius:50%;border:1px solid rgba(184,145,63,.6);transition:background-color .3s,border-color .3s}
#app .qz-ck::after{content:'';position:absolute;left:7px;top:4px;width:5px;height:9px;border:solid #2A211A;border-width:0 2px 2px 0;transform:rotate(45deg) scale(0);transition:transform .3s var(--ng-ease)}
#app .qz-opt[aria-pressed="true"]{background:#3B2D22;color:#F5EEE3;border-color:#3B2D22}
#app .qz-opt[aria-pressed="true"] .qz-ic{background:#B8913F}
#app .qz-opt[aria-pressed="true"] .qz-ic::before{background:#2A211A}
#app .qz-opt[aria-pressed="true"] .qz-ck{background:#D6B566;border-color:#D6B566}
#app .qz-opt[aria-pressed="true"] .qz-ck::after{transform:rotate(45deg) scale(1)}
#app .qz-nav{display:flex;align-items:center;gap:18px;min-height:44px;margin-top:auto}
#app .qz-link{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0;background:none;border:0;font:inherit;font-size:14px;font-weight:500;color:#3B2D22;text-decoration:underline;text-underline-offset:5px;cursor:pointer}
#app .qz-arrow{width:8px;height:8px;border:solid currentColor;border-width:0 0 1.5px 1.5px;transform:rotate(45deg)}
/* finished */
#app .qz-done{align-items:flex-start;justify-content:center;gap:0}
#app .qz-seal{width:76px;height:76px;margin-bottom:18px}
#app .qz-seal svg{width:100%;height:100%;fill:none;stroke:#B8913F;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#app .qz-done .qz-title{margin-bottom:10px}
#app .qz-answers{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
#app .qz-ans{display:inline-flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:56px;padding:8px 18px;font:inherit;color:#2A211A;background:#fff;border:1px solid rgba(184,145,63,.5);border-radius:20px;cursor:pointer;transition:border-color .25s,transform .3s var(--ng-ease)}
#app .qz-ans:hover{border-color:#B8913F;transform:translateY(-2px)}
#app .qz-ans span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.6}
#app .qz-ans strong{font-size:15px;font-weight:500}
/* the routine it builds */
#app .qz-result{display:flex;flex-direction:column;gap:20px;padding:clamp(22px,3vw,36px);box-sizing:border-box;color:var(--rc-fg);background:var(--rc-bg);border:1px solid var(--rc-ln);border-radius:32px;box-shadow:0 36px 70px -44px rgba(20,12,6,.7)}
#app .qz-rhead{display:flex;align-items:center;gap:16px}
#app .qz-mode{width:54px;height:54px;background:var(--rc-ic)}
#app .qz-mode::before{inset:13px;background:var(--rc-icfg)}
#app .qz-result .qz-kicker{color:var(--rc-k)}
#app .qz-rtitle{margin:2px 0 0;font-size:clamp(26px,2.6vw,36px);line-height:1.08;font-weight:400;color:var(--rc-fg)}
#app .qz-list{margin:0;padding:0;list-style:none}
#app .qz-item{display:grid;grid-template-columns:64px minmax(0,1fr) auto;align-items:center;gap:16px;padding:12px 0;border-bottom:1px solid var(--rc-ln);color:inherit;transition:transform .35s var(--ng-ease)}
#app .qz-list li:first-child .qz-item{border-top:1px solid var(--rc-ln)}
#app .qz-item:hover{transform:translateX(4px)}
#app .qz-img{width:64px;height:64px;border-radius:20px;background:var(--rc-box);display:flex;align-items:center;justify-content:center;overflow:hidden}
#app .qz-img img{width:82%;height:82%;object-fit:contain;mix-blend-mode:multiply}
#app .qz-info{display:flex;flex-direction:column;gap:2px;min-width:0}
#app .qz-step{display:flex;align-items:baseline;gap:8px;font-size:11px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--rc-k)}
#app .qz-sn{letter-spacing:.06em;opacity:.8}
#app .qz-name{font-size:15px;font-weight:500;line-height:1.3}
#app .qz-brand{font-size:12px;color:var(--rc-mut)}
#app .qz-price{font-size:20px;white-space:nowrap}
#app .qz-foot{margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-top:6px}
#app .qz-sum{display:flex;flex-direction:column;gap:2px}
#app .qz-tl{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--rc-mut)}
#app .qz-total{font-size:clamp(38px,4vw,52px);line-height:1}
@media (max-width:520px){#app .qz-item{grid-template-columns:56px minmax(0,1fr);gap:12px}#app .qz-img{width:56px;height:56px;border-radius:16px}#app .qz-price{grid-column:2;font-size:18px}#app .qz-wrap{padding-top:72px;padding-bottom:72px}#app .qz-orb{top:52px}}
@keyframes qzIn{from{opacity:0;transform:translateY(14px)}}
@keyframes qzRow{from{opacity:0;transform:translateX(18px)}}
@keyframes qzDraw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes qzFloat{50%{transform:translateY(-10px)}}
@media (prefers-reduced-motion:no-preference){
  #app .qz-stage{animation:qzIn .55s var(--ng-ease) both}
  #app .qz-opt{animation:qzIn .55s var(--ng-ease) both;animation-delay:calc(var(--i) * 70ms + 60ms)}
  #app .qz-list li{animation:qzRow .55s var(--ng-ease) both;animation-delay:calc(var(--i) * 70ms)}
  #app .qz-orb{animation:qzFloat 9s ease-in-out infinite}
  #app .qz-seal circle,#app .qz-seal path{stroke-dasharray:1;stroke-dashoffset:1;animation:qzDraw .9s ease .1s forwards}
  #app .qz-seal path{animation-delay:.6s;animation-duration:.5s}
}
@media (prefers-reduced-motion:reduce){#app .qz-seal circle,#app .qz-seal path{stroke-dasharray:none}}

  function renderCheckout() {

    if (!root) return;
    root.innerHTML = checkoutHTML();
  }
  function refreshCheckout() {
    var s = app.querySelector('.ck-sum');

    else if (e.target.type === 'checkbox') ck.f[e.target.name] = e.target.checked;
    else ck.f[e.target.name] = e.target.value;
  });
  app.addEventListener('change', function (e) {
    var n = e.target.name;
    if (n === 'ship' || n === 'pay') { ck[n] = e.target.value; renderCheckout(); var r = app.querySelector('input[name="' + n + '"]:checked'); if (r) r.focus(); }
    else if (n === 'terms') ck.f.terms = e.target.checked;
  });
  app.addEventListener('click', function (e) {
    if (e.target.closest('[data-apply]')) {
      var code = (ck.code || '').trim().toUpperCase();
      if (code === CODE) { ck.applied = true; ck.msg = subtotal() >= CODE_MIN ? T('Código WELCOME10 aplicado: 10% de desconto.') : T('O código WELCOME10 aplica-se a compras acima de 10 €.'); }
      else { ck.applied = false; ck.msg = code ? T('Este código não é válido.') : T('Escreva um código de desconto.'); }
      refreshCheckout();
      return;
    }
    if (e.target.closest('[data-reset]')) { ck = { f: {}, ship: 'home', pay: 'mbway', code: '', applied: false, msg: '', done: null, tried: false }; }
  });
  app.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target.name === 'code') { e.preventDefault(); app.querySelector('[data-apply]').click(); }
  });
  app.addEventListener('submit', function (e) {
    var form = e.target.closest('.ck-form');
    if (!form) return;
    e.preventDefault();
    ck.tried = true;
    form.classList.add('was-validated');
    if (!form.checkValidity()) {
      var bad = form.querySelector(':invalid');
      if (bad) bad.focus();
      return;
    }
    ck.done = { email: ck.f.email || '', ref: 'NG-' + String(Math.floor(10000 + Math.random() * 90000)) };
    cart = []; persist(); badges(false);
    renderCheckout();
    window.scrollTo({ top: 0, behavior: mq.matches ? 'instant' : 'smooth' });
  });

  /* ---------- hooks ---------- */
  var prev = window.__ngAfterDraw;
  window.__ngAfterDraw = function (root, entering) {
    if (prev) prev(root, entering);
    badges(false);
    if (app.getAttribute('data-page') === 'checkout') renderCheckout();
    else if (ck.done && entering) ck = { f: {}, ship: 'home', pay: 'mbway', code: '', applied: false, msg: '', done: null, tried: false };

  };
  document.addEventListener('ng-lang', function () {
    if (!drawer.hidden) renderCart(false);
    if (!search.hidden) { renderSearch(); search.querySelector('.ng-sf input').focus(); }
  });
  window.__ngCart = { add: add, open: openCart, items: function () { return cart.slice(); } };
})();

<script>
(function () {
  var app = document.getElementById('app');
  var D = window.__NG_I18N || { en: {}, ko: {} };
  var LANGS = [['pt', 'pt-PT', 'Português', 'PT'], ['en', 'en', 'English', 'EN'], ['ko', 'ko', '한국어', 'KO']];
  var LABEL = { pt: 'Idioma', en: 'Language', ko: '언어' };
  var LETTER = /[A-Za-zÀ-ÿ\u3131-\uD79D]/;

  var lang = 'en', ptTitle = null, setTitle = null, missing = window.__ngMissing = {};

  function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
  function price(s) { return s.replace(/(\d+),(\d{2})\s?€/g, '€$1.$2').replace(/(\d+)\s?€/g, '€$1'); }
  function miss(k) { missing[k] = (missing[k] || 0) + 1; }

  /* Exact key first, then the same key with every number turned into {0}, {1}... */
  function lookup(s, dict) {
    if (dict[s] != null) return dict[s];
    var nums = [], k = s.replace(/\d+/g, function (m) { nums.push(m); return '{' + (nums.length - 1) + '}'; });
    if (nums.length && dict[k] != null) return dict[k].replace(/\{(\d+)\}/g, function (m, i) { return nums[+i]; });
    return null;
  }

  function text(s, dict, quiet) {
    var core = s.replace(/\s+/g, ' ').trim();
    if (!core) return null;
    var lead = /^\s*/.exec(s)[0] ? ' ' : '', trail = /\s*$/.exec(s)[0] ? ' ' : '';
    if (!LETTER.test(core)) { var p = price(core); return p !== core ? lead + p + trail : null; }
    var t = lookup(core, dict);
    if (t == null) { if (!quiet) miss(core); return null; }
    return lead + price(t.replace(/<\/?em>/g, '')) + trail;
  }

  function attrs(el, dict) {
    for (var i = 0; i < ATTRS.length; i++) {
      var v = el.getAttribute(ATTRS[i]);
      if (!v || !LETTER.test(v)) continue;
      var t = text(v, dict);
      if (t != null) el.setAttribute(ATTRS[i], t.trim());
    }
  }

  /* A sentence with inline markup becomes one key: "Envio grátis acima de <a>50 €</a>" */
  function mixedKey(el) {
    var key = '', els = [], words = false;
    for (var n = el.firstChild; n; n = n.nextSibling) {
      if (n.nodeType === 3) key += n.nodeValue;
      else if (n.nodeType === 1) {
        var id = String.fromCharCode(97 + els.length), tx = n.textContent;
        if (n.children.length && tx.trim()) return null;
        if (tx.trim()) words = true;
        els.push(n);
        key += tx.trim() ? '<' + id + '>' + tx + '</' + id + '>' : '<' + id + '/>';
      }
    }
    return words ? { key: key.replace(/\s+/g, ' ').trim(), els: els } : null;
  }

  function applyMixed(el, m, t) {
    var out = [], used = {}, re = /<([a-z])\/>|<([a-z])>([\s\S]*?)<\/\2>|([^<]+)/g, x;
    while ((x = re.exec(t))) {
      if (x[4] != null) { out.push(document.createTextNode(price(x[4]))); continue; }
      var id = x[1] || x[2], node = m.els[id.charCodeAt(0) - 97];
      if (!node || used[id]) continue;
      used[id] = 1;
      if (x[2]) node.textContent = price(x[3]);
      out.push(node);
    }
    el.replaceChildren.apply(el, out);
  }

  /* Hero headlines are split into word spans for the animation: translate the sentence, rebuild the spans */
  function headline(h1, dict) {

        return '<span class="hw" style="--i:' + (i++) + '"><span>' + esc(w) + '</span></span>';
      }).join(' ');
    }
    h1.innerHTML = t.split(/(<em>[\s\S]*?<\/em>)/).filter(function (p) { return p.trim(); }).map(function (p) {
      if (p.indexOf('<em>') !== 0) return words(p);

    }).join(' ');

  function walk(el, dict) {

    }
    var quiet = false;
    if (hasText && hasEl) {
      var m = mixedKey(el);
      if (m && LETTER.test(m.key)) {
        var t = lookup(m.key, dict);
        if (t != null) {
          applyMixed(el, m, t);
          mark(el);
          for (var k = 0; k < m.els.length; k++) attrs(m.els[k], dict);
          return;
        }
        miss(m.key);
        quiet = true;
      }
    }

      if (n.nodeType === 3) { var r = text(n.nodeValue, dict, quiet); if (r != null) { n.nodeValue = r; mark(el); } }

  var GLOBE = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c2.6 2.6 3.8 5.6 3.8 9s-1.2 6.4-3.8 9c-2.6-2.6-3.8-5.6-3.8-9S9.4 5.6 12 3z"></path></svg>';

  function current() { for (var i = 0; i < LANGS.length; i++) if (LANGS[i][0] === lang) return LANGS[i]; return LANGS[0]; }

  function mountSwitcher() {

    for (var s = 0; s < slots.length; s++) {

      w.setAttribute('data-no-i18n', '');

        return '<button type="button" role="menuitemradio" data-lang="' + l[0] + '" lang="' + l[1] + '" aria-checked="' + (l[0] === lang) + '" tabindex="-1">' + l[2] + '</button>';

      slots[s].insertBefore(w, slots[s].firstChild);

    var open = app.querySelectorAll('.ng-lang.is-open');
    for (var i = 0; i < open.length; i++) {
      open[i].classList.remove('is-open');
      var b = open[i].querySelector('.ng-lang-btn');
      b.setAttribute('aria-expanded', 'false');
      if (focusBtn) b.focus();
    }
  }

  function setLang(l) {
    lang = l;
    try { localStorage.setItem('ng-lang', l); } catch (e) {}

    if (b && b.offsetParent) b.focus();
  }

  document.addEventListener('click', function (e) {
    var t = e.target.closest ? e.target : null;

  document.addEventListener('keydown', function (e) {
    var menu = e.target.closest && e.target.closest('.ng-lang-menu');
    if (e.key === 'Escape' && app.querySelector('.ng-lang.is-open')) { close(true); return; }

    e.preventDefault();
    var items = menu.querySelectorAll('button'), i = Array.prototype.indexOf.call(items, e.target);
    items[(i + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length].focus();
  });

  function apply() {
    document.documentElement.lang = current()[1];
    if (document.title !== setTitle) ptTitle = document.title;
    mountSwitcher();
    if (lang === 'pt') { document.title = setTitle = ptTitle; return; }
    var dict = D[lang];
    walk(app, dict);
    document.title = setTitle = ptTitle.split(' · ').map(function (p) {
      var t = lookup(p, dict);
      if (t == null) miss(p);
      return t == null ? p : t;
    }).join(' · ');
  }

  var prev = window.__ngAfterDraw;
  window.__ngAfterDraw = function (root, entering) { apply(); if (prev) prev(root, entering); };
  window.__ngSetLang = setLang;

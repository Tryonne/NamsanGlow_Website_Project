<!doctype html>
<html lang="pt-PT" data-time="manha">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Namsan Glow · Luz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Figtree:wght@300;400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&display=swap" rel="stylesheet">
<script>
  // Open in the moment of the visitor's day (19h to 7h is night) before anything paints
  (() => { try { const s = sessionStorage.getItem('ng-time-H'), h = new Date().getHours();
    document.documentElement.dataset.time = s || (h >= 19 || h < 7 ? 'noite' : 'manha'); } catch (e) {} })();
</script>
<link rel="preload" as="image" href="assets/hero-gel-textures.webp" fetchpriority="high">
<link rel="stylesheet" href="assets/ng-e.css">
<style>
/* H · Luz: E with a sunrise palette by day and candle-lit charcoal by night */
:root,[data-time="manha"]{
  --bg:#F7EFE6; --bg-2:#F0E2D2; --paper:#FFFAF4; --ink:#2E211A; --muted:#6B5749; --line:#E4D3C1;
  --accent:#B5803A; --accent-ink:#7E5518; --accent-soft:#EFC789;
  --deep:#2E211A; --deep-2:#3B2B21; --on-deep:#F7EFE6; --on-deep-muted:#D9C7AE;
  --hero-bg:linear-gradient(180deg,#F8D9C2 0%,#F7E6D4 55%,#F7EFE6 100%); --hero-solid:#F8D9C2; --hero-ink:#2E211A; --hero-muted:#5F4C3F;
  --t1:#F2D6CC; --t2:#F5E3C3; --t3:#DCE3CF; --t4:#EBDCCB; --t5:#F8EEE2;
  --shade:46,33,26;
}
[data-time="noite"]{
  --bg:#151413; --bg-2:#1D1C1A; --paper:#1F1D1B; --ink:#F3EEE6; --muted:#B4ACA1; --line:#302D2A;
  --accent:#D4A955; --accent-ink:#E2BD72; --accent-soft:#E8C98A;
  --deep:#0E0D0C; --deep-2:#141312; --on-deep:#F3EEE6; --on-deep-muted:#BDB4A8;
  --hero-bg:radial-gradient(60% 75% at 72% 48%,#262017 0%,#131211 55%,#0B0B0A 100%); --hero-solid:#121110; --hero-ink:#F3EEE6; --hero-muted:#C9C0B3;
  --t1:#E7DFD2; --t2:#E2D5BD; --t3:#DEDAD2; --t4:#D9CEBB; --t5:#ECE6DC;
  --shade:0,0,0;
  color-scheme:dark;
}
body{transition:background-color .2s}
</style>
</head>
<body>
<p class="ann" id="ann"></p>
<header class="hdr" id="hdr"></header>
<div popover id="langMenu" class="lang-menu"></div>
<dialog class="mnav" id="mnav" closedby="any"></dialog>
<main id="app"></main>
<footer class="ft" id="ft"></footer>

<script>
window.NG_MOCK = 'H';
window.NG_E = {
  mock: 'H', label: 'Luz', dayNight: true,
  sections: ['hero', 'brands', 'ritual', 'quiz', 'new', 'story', 'quotes'],
  hero: {

    leadNight: ['À noite, remover o dia e deixar a pele reparar. Cosmética coreana escolhida em Braga.', 'At night, wash off the day and let your skin repair. Korean skincare chosen in Braga.', '저녁에는 하루를 씻어내고 피부가 회복하도록 두세요. 브라가에서 고른 한국 화장품.'],
    img: 'assets/hero-gel-textures.webp', imgNight: 'assets/u-night-oil.webp'

  story: { img: 'assets/u-story-day.webp', alt: ['Mulher de roupão a aplicar uma bruma facial ao espelho', 'Woman in a bathrobe applying a face mist at the mirror', '거울 앞에서 페이스 미스트를 뿌리는 여성'] }
};
</script>
